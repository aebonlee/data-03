<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 스카이라이더스</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<section class="page-head">
  <span class="cloud c1">☁️</span>
  <span class="cloud c2">🚲</span>
  <h1 id="headTitle">로그인</h1>
  <p>스카이라이더스와 함께 달려요</p>
</section>

<section class="section">
  <div class="container" style="max-width:460px">
    <div class="chips mb-3" style="justify-content:center">
      <button class="chip active" id="tabLogin">로그인</button>
      <button class="chip" id="tabSignup">회원가입</button>
    </div>

    <div class="card card-pad">
      <!-- 로그인 -->
      <form id="loginForm">
        <div class="field">
          <label>이메일 <span class="req">*</span></label>
          <input class="input" type="email" name="email" required autocomplete="email" placeholder="rider@example.com">
        </div>
        <div class="field">
          <label>비밀번호 <span class="req">*</span></label>
          <input class="input" type="password" name="password" required autocomplete="current-password" placeholder="비밀번호">
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">로그인</button>
        <p class="tiny muted text-center mt-2 mb-0">
          비회원도 모임 신청과 글쓰기가 가능합니다.<br>
          로그인하면 내 신청·내 글을 한 곳에서 관리할 수 있어요.
        </p>
      </form>

      <!-- 회원가입 -->
      <form id="signupForm" style="display:none">
        <div class="field">
          <label>이메일 <span class="req">*</span></label>
          <input class="input" type="email" name="email" required autocomplete="email" placeholder="rider@example.com">
        </div>
        <div class="field-row">
          <div class="field">
            <label>비밀번호 <span class="req">*</span></label>
            <input class="input" type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="6자 이상">
          </div>
          <div class="field">
            <label>비밀번호 확인 <span class="req">*</span></label>
            <input class="input" type="password" name="password2" required minlength="6" autocomplete="new-password" placeholder="한 번 더">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>이름 <span class="req">*</span></label>
            <input class="input" name="name" required maxlength="20" placeholder="홍길동">
          </div>
          <div class="field">
            <label>연락처</label>
            <input class="input" name="phone" maxlength="20" placeholder="010-0000-0000">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>활동 지역</label>
            <select class="select" name="region"></select>
          </div>
          <div class="field">
            <label>라이딩 경력</label>
            <select class="select" name="level">
              <option value="beginner">입문 (1년 미만)</option>
              <option value="intermediate">중급 (1~3년)</option>
              <option value="advanced">상급 (3년 이상)</option>
            </select>
          </div>
        </div>
        <label class="check mb-3">
          <input type="checkbox" required> 안전 라이딩 수칙과 개인정보 처리방침에 동의합니다.
        </label>
        <button class="btn btn-primary btn-block btn-lg" type="submit">가입하기</button>
      </form>

      <div id="alertBox" class="mt-3"></div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async () => {
  await App.mount('');

  /* 이미 로그인 상태라면 마이페이지로 */
  if (App.isLogin()) { location.replace('mypage.html'); return; }

  const loginForm  = App.$('#loginForm');
  const signupForm = App.$('#signupForm');
  const next = App.qs('next', 'mypage.html');

  App.REGIONS.forEach(r => signupForm.region.insertAdjacentHTML('beforeend', `<option>${r}</option>`));

  /* ---- 탭 전환 ---- */
  function showTab(which) {
    const login = which === 'login';
    App.$('#tabLogin').classList.toggle('active', login);
    App.$('#tabSignup').classList.toggle('active', !login);
    loginForm.style.display  = login ? '' : 'none';
    signupForm.style.display = login ? 'none' : '';
    App.$('#headTitle').textContent = login ? '로그인' : '회원가입';
    document.title = (login ? '로그인' : '회원가입') + ' · 스카이라이더스';
    App.$('#alertBox').innerHTML = '';
  }
  App.$('#tabLogin').addEventListener('click', () => showTab('login'));
  App.$('#tabSignup').addEventListener('click', () => showTab('signup'));
  if (App.qs('mode') === 'signup') showTab('signup');

  /* ---- 로그인 ---- */
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = '로그인 중…';

    const { error } = await sb.auth.signInWithPassword({
      email: f.email.value.trim(), password: f.password.value
    });

    btn.disabled = false; btn.textContent = '로그인';
    if (error) {
      App.$('#alertBox').innerHTML = `<div class="alert alert-error">${App.escapeHtml(App.readError(error))}</div>`;
      return;
    }
    App.ok('환영합니다! 🚴');
    setTimeout(() => location.href = next, 500);
  });

  /* ---- 회원가입 ---- */
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.password.value !== f.password2.value) {
      App.$('#alertBox').innerHTML = `<div class="alert alert-error">비밀번호가 서로 다릅니다.</div>`;
      return;
    }
    const btn = f.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = '가입 중…';

    const { data, error } = await sb.auth.signUp({
      email: f.email.value.trim(),
      password: f.password.value,
      options: { data: {
        name:   f.name.value.trim(),
        phone:  f.phone.value.trim(),
        region: f.region.value,
        level:  f.level.value
      } }
    });

    btn.disabled = false; btn.textContent = '가입하기';
    if (error) {
      App.$('#alertBox').innerHTML = `<div class="alert alert-error">${App.escapeHtml(App.readError(error))}</div>`;
      return;
    }

    /* 이메일 인증이 켜져 있으면 session 이 없습니다. */
    if (!data.session) {
      App.$('#alertBox').innerHTML =
        `<div class="alert alert-info">가입 신청이 접수되었습니다.<br>
         <strong>${App.escapeHtml(f.email.value.trim())}</strong> 로 보낸 인증 메일을 확인해 주세요.</div>`;
      signupForm.reset();
      return;
    }

    /* 프로필 생성 후 이동 */
    await sb.from(T('profiles')).upsert({
      id:     data.user.id,
      email:  data.user.email,
      name:   f.name.value.trim(),
      phone:  f.phone.value.trim() || null,
      region: f.region.value,
      level:  f.level.value
    });
    App.ok('가입이 완료되었습니다! 🎉');
    setTimeout(() => location.href = 'mypage.html', 700);
  });
})();
</script>
</body>
</html>
