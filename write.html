<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 · 스카이라이더스</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .thumb-preview { max-width:260px; border-radius:10px; border:1px solid var(--line); margin-top:10px; }
</style>
</head>
<body>

<section class="page-head">
  <span class="cloud c1">☁️</span>
  <span class="cloud c2">✏️</span>
  <h1 id="headTitle">글쓰기</h1>
  <p id="headSub">&nbsp;</p>
</section>

<section class="section">
  <div class="container" style="max-width:800px">
    <div class="card card-pad">
      <form id="form">
        <div class="field">
          <label>게시판</label>
          <input class="input" id="boardName" disabled>
        </div>

        <div class="field">
          <label>제목 <span class="req">*</span></label>
          <input class="input" name="title" required maxlength="120" placeholder="제목을 입력하세요">
        </div>

        <div class="field-row" id="metaRow">
          <div class="field" id="regionField">
            <label>지역</label>
            <select class="select" name="region">
              <option value="">선택 안 함</option>
            </select>
          </div>
          <div class="field" id="optionField"></div>
        </div>

        <div class="field" id="imageField" style="display:none">
          <label>대표 이미지</label>
          <input class="input" name="image_url" placeholder="https://... 이미지 주소를 붙여넣으세요">
          <div id="uploadRow" class="row mt-2" style="display:none">
            <input type="file" id="fileInput" accept="image/*" style="font-size:.85rem">
            <button type="button" class="btn btn-ghost btn-sm" id="btnUpload">업로드</button>
            <span class="tiny muted" id="uploadMsg"></span>
          </div>
          <p class="field-hint">로그인하면 사진을 직접 올릴 수 있습니다. (5MB 이하)</p>
          <img class="thumb-preview" id="preview" style="display:none" alt="미리보기">
        </div>

        <div class="field">
          <label>내용 <span class="req">*</span></label>
          <textarea class="textarea" name="content" required maxlength="10000"
                    placeholder="내용을 입력하세요"></textarea>
        </div>

        <div class="field-row" id="guestFields" style="display:none">
          <div class="field">
            <label>작성자 <span class="req">*</span></label>
            <input class="input" name="author_name" maxlength="20" placeholder="닉네임">
          </div>
          <div class="field">
            <label>비밀번호 <span class="req">*</span></label>
            <input class="input" type="password" name="password" minlength="4" maxlength="30" placeholder="4자 이상">
            <p class="field-hint">수정·삭제할 때 필요합니다.</p>
          </div>
        </div>

        <div id="alertBox"></div>

        <div class="row-between mt-3">
          <a class="btn btn-ghost" id="btnCancel" href="#">취소</a>
          <button class="btn btn-primary btn-lg" type="submit" id="btnSubmit">등록하기</button>
        </div>
      </form>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async () => {
  await App.mount('board');
  const E = App.escapeHtml;

  const boardKey = App.BOARDS[App.qs('board', 'free')] ? App.qs('board', 'free') : 'free';
  const meta     = App.BOARDS[boardKey];
  const editId   = App.qs('id') ? Number(App.qs('id')) : null;
  const isEdit   = !!editId;

  const form = App.$('#form');
  let original = null;      // 수정 모드에서 불러온 원본
  let guestPw  = null;      // 비회원 수정용 비밀번호

  /* ---------- 화면 준비 ---------- */
  document.title = `${isEdit ? '글 수정' : '글쓰기'} · 스카이라이더스`;
  App.$('#headTitle').textContent = `${meta.emoji} ${meta.name} ${isEdit ? '수정' : '글쓰기'}`;
  App.$('#headSub').textContent   = meta.desc;
  App.$('#boardName').value       = meta.name;
  App.$('#btnCancel').href        = isEdit ? `post.html?id=${editId}` : `board.html?board=${boardKey}`;
  App.$('#btnSubmit').textContent = isEdit ? '수정 완료' : '등록하기';

  /* 지역 옵션 */
  App.REGIONS.forEach(r => form.region.insertAdjacentHTML('beforeend', `<option>${r}</option>`));

  /* 게시판별 추가 옵션 */
  const optionField = App.$('#optionField');
  if (boardKey === 'notice') {
    optionField.innerHTML = `<label>표시 옵션</label>
      <label class="check mt-1"><input type="checkbox" name="is_pinned"> 목록 상단에 고정</label>`;
  } else if (boardKey === 'qna') {
    optionField.innerHTML = `<label>공개 설정</label>
      <label class="check mt-1"><input type="checkbox" name="is_secret"> 🔒 비밀글로 작성</label>`;
  } else {
    optionField.innerHTML = '';
  }
  if (boardKey === 'review' || boardKey === 'free') App.$('#imageField').style.display = '';

  /* 공지사항은 관리자만 */
  if (meta.adminOnly && !App.isAdmin()) {
    App.$('#alertBox').innerHTML = `<div class="alert alert-error">공지사항은 관리자만 작성할 수 있습니다.</div>`;
    App.$('#btnSubmit').disabled = true;
    form.querySelectorAll('input,textarea,select').forEach(el => el.disabled = true);
  }

  /* 비회원 입력란 / 업로드 버튼 */
  App.$('#guestFields').style.display = App.isLogin() ? 'none' : '';
  if (App.isLogin()) App.$('#uploadRow').style.display = '';

  /* 이미지 미리보기 */
  const preview = App.$('#preview');
  function syncPreview() {
    const v = form.image_url?.value.trim();
    if (v) { preview.src = v; preview.style.display = ''; } else { preview.style.display = 'none'; }
  }
  form.image_url?.addEventListener('input', syncPreview);

  /* ---------- 이미지 업로드 (Supabase Storage) ---------- */
  App.$('#btnUpload')?.addEventListener('click', async () => {
    const file = App.$('#fileInput').files[0];
    const msg  = App.$('#uploadMsg');
    if (!file) { App.err('파일을 선택해 주세요.'); return; }
    if (file.size > 5 * 1024 * 1024) { App.err('5MB 이하 이미지만 올릴 수 있습니다.'); return; }

    msg.textContent = '업로드 중…';
    const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${App.user().id}/${Date.now()}.${ext}`;

    const { error } = await sb.storage.from('bike-photos').upload(path, file, { upsert: false });
    if (error) { msg.textContent = ''; App.err(App.readError(error)); return; }

    const { data } = sb.storage.from('bike-photos').getPublicUrl(path);
    form.image_url.value = data.publicUrl;
    syncPreview();
    msg.textContent = '완료 ✅';
    App.ok('사진을 올렸습니다.');
  });

  /* ---------- 수정 모드: 기존 글 불러오기 ---------- */
  if (isEdit) {
    const { data } = await sb.from(T('posts')).select('*').eq('id', editId).maybeSingle();
    if (!data) {
      App.$('#alertBox').innerHTML = `<div class="alert alert-error">글을 찾을 수 없거나 수정 권한이 없습니다.</div>`;
      App.$('#btnSubmit').disabled = true;
      return;
    }
    original = data;
    form.title.value   = data.title;
    form.content.value = data.content;
    if (form.region)    form.region.value = data.region || '';
    if (form.image_url) { form.image_url.value = data.image_url || ''; syncPreview(); }
    if (form.is_pinned) form.is_pinned.checked = data.is_pinned;
    if (form.is_secret) form.is_secret.checked = data.is_secret;

    /* 비회원 글이면 비밀번호가 필요합니다. post.html에서 확인했다면 재사용합니다. */
    if (!data.author_id && !App.isAdmin()) {
      guestPw = sessionStorage.getItem('skyriders-edit-pw-' + editId);
      if (!guestPw) {
        guestPw = await App.askPassword('글 수정', '작성 시 입력한 비밀번호를 넣어주세요.');
        if (!guestPw) { location.href = `post.html?id=${editId}`; return; }
      }
      App.$('#guestFields').style.display = 'none';   // 수정 시에는 다시 받지 않음
    }
  }

  /* ---------- 저장 ---------- */
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = App.$('#btnSubmit');
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = '저장 중…';

    const payload = {
      title:     form.title.value.trim(),
      content:   form.content.value.trim(),
      region:    form.region?.value || null,
      image_url: form.image_url?.value.trim() || null,
      is_secret: form.is_secret?.checked ?? false
    };

    let error = null, newId = editId;

    if (isEdit) {
      const res = await sb.rpc('bike_update_post', {
        p_id:        editId,
        p_password:  guestPw,
        p_title:     payload.title,
        p_content:   payload.content,
        p_region:    payload.region,
        p_image_url: payload.image_url,
        p_images:    null,
        p_is_secret: payload.is_secret
      });
      error = res.error;
      /* 공지 고정 여부는 관리자만 바꿀 수 있으므로 별도 업데이트 */
      if (!error && form.is_pinned && App.isAdmin()) {
        await sb.from(T('posts')).update({ is_pinned: form.is_pinned.checked }).eq('id', editId);
      }
    } else {
      const res = await sb.rpc('bike_create_post', {
        p_board:       boardKey,
        p_title:       payload.title,
        p_content:     payload.content,
        p_author_name: App.isLogin() ? null : form.author_name.value.trim(),
        p_password:    App.isLogin() ? null : form.password.value,
        p_region:      payload.region,
        p_image_url:   payload.image_url,
        p_images:      [],
        p_is_secret:   payload.is_secret
      });
      error = res.error;
      newId = res.data;
      if (!error && form.is_pinned?.checked && App.isAdmin()) {
        await sb.from(T('posts')).update({ is_pinned: true }).eq('id', newId);
      }
    }

    btn.disabled = false; btn.textContent = label;
    if (error) { App.err(App.readError(error)); return; }

    sessionStorage.removeItem('skyriders-edit-pw-' + editId);
    App.ok(isEdit ? '수정되었습니다.' : '등록되었습니다.');
    setTimeout(() => location.href = `post.html?id=${newId}`, 600);
  });
})();
</script>
</body>
</html>
